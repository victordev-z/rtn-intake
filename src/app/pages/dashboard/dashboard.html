<div class="d-flex vh-100 justify-content-center align-items-center bg-light">

  <div class="card shadow p-4 text-center" style="width: 420px;">

    <h4 class="mb-2">Welcome, {{ userName }}</h4>

    <p class="text-muted mb-4">
      You have {{ intake.forms.length - intake.currentStep }} forms remaining
    </p>

    <!-- Progress -->
    <div class="mb-3 text-start">
      <div class="d-flex justify-content-between mb-1">
        <small>Progress</small>
        <small>
          {{ intake.currentStep }} / {{ intake.forms.length }}
        </small>
      </div>

      <div class="progress">
        <div 
          class="progress-bar"
          role="progressbar"
          [style.width.%]="(intake.currentStep / intake.forms.length) * 100">
        </div>
      </div>
    </div>

    <button
      routerLink="/intake"
      class="btn btn-primary w-100 mt-3">
      Continue Forms
    </button>

  </div>

</div>
